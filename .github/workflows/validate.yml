name: Validate starter repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate repository bundle
        run: python validate_bundle.py

      - name: Run unit smoke tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q prototype tests validate_bundle.py
